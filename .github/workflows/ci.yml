name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    steps:
      - uses: actions/checkout@v4
      - name: Run tests (${{ matrix.shell }})
        shell: ${{ matrix.shell }}
        run: ./tests/Test-HereWhy.ps1
